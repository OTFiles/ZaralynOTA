name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: 8.3
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}

    - name: Build Debug APK
      id: build
      run: |
        set -o pipefail
        gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build-output.log
        exit ${PIPESTATUS[0]}

    - name: Upload Build Log On Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build-output.log
        if-no-files-found: ignore

    - name: Upload Debug APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: ignore

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: 8.3
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}

    - name: Decode keystore
      run: |
        echo "${{ secrets.OTF_JKS_BASE64 }}" | base64 -d > otf.jks

    - name: Build Release APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: gradle assembleRelease --no-daemon --stacktrace

    - name: Rename APK
      run: |
        mv app/build/outputs/apk/release/app-release.apk ZaralynOTA-v${{ github.run_number }}.apk

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: Zaralyn OTA v${{ github.run_number }}
        body: |
          ## Zaralyn OTA 固件下载器

          按当前机型向读书郎 OTA 服务器查询固件包地址，并支持直接下载（Material Design 3）。
          **支持 Android 5.0 (API 21) ~ Android 14 (API 34)，含老机型 Android 7 (API 24/25)。**

          ### 功能

          - **查询固件地址**：POST `ota.readboy.com/update.php`，兼容 JSON / XML 两种响应形态
          - **机型匹配**：服务器按 `(model, board, android, chipset)` 四元组精确匹配（`chipset` 取 `ro.build.chipset`）
          - **自动参数探测**（默认开）：默认参数不匹配时自动尝试多种 chipset/display/hard 取值，命中即用
          - **高级参数**：可手动覆盖 model/board/android/chipset/display/hard/serial（持久化，可恢复默认）
          - **通道选择**：正式 / 测试 / 公测（服务器参数 `debug` = 0 / 1 / 2）
          - **直接下载**：流式下载 + 实时进度/速度 + MD5 校验 + 可取消
          - **兼容性自检**：系统版本/属性读取/OTA 连通/目录可写/剩余空间/FileProvider，一键复制报告
          - **日志系统**：Logcat / 内存 / 按天滚动文件三路输出，崩溃自动落盘

          ### 本版修正（v1.5）

          - **状态语义修正**：只有服务端返回 `model not found` 才继续换 `chipset` 探测；
            `already latest`（机型匹配成功且已是最新版）/ `no update available`（机型匹配但无该版本基线包）
            属服务端定论，立即停止探测并作为「结论」展示（不再是错误弹窗，也不再无意义连发请求）
          - **新增「服务端固件目录探测」**：按 `<model>_<chipset>` 探测 `/ConfigXml/` 目录存在性
            （403=目录存在 / **404=服务端从未为该机型上传过固件**），结论里一并展示
          - **chipset 探测候选改为属性白名单**（`ro.build.chipset` / `ro.board.platform` / `ro.boot.hardware` /
            `ro.product.hardware.version` / `ro.boot.product.hardware.sku` 等）：
            此前按关键词模糊匹配会把 `init.svc.*`、`persist.*`、`ro.hardware.egl` 之类的值
            （如 `stopped` / `true` / `adreno` / `2`）当作 chipset 发给服务器
          - 探测进度与记录改为显示**实际取值**（如 `chipset=RB961P（ro.product.hardware.version）`）

          ### 安装说明

          1. 下载 APK 并安装（Android 5.0+）
          2. 首次启动无需额外权限（仅联网）
          3. 选通道 → 「查询更新」→「下载固件」

          ### 说明

          - 服务器在当前版本号（`display`）基础上按梯度下发**增量包**；伪造 `fingerprint` 不会得到完整包，
            能否拿到全量包取决于服务端机型库条目
          - 若提示 `model not found`：先看「兼容性自检」，再用「高级参数」手动填 `chipset`
          - 逆向参考：DreamUpdate 2.1.0（com.dream.ota.update）
          - 固件保存于应用私有目录 `Android/data/com.readboy.otadownloader/files/Download/`
          - 仅供设备所有者对自己的设备做固件存档使用
        files: ZaralynOTA-v${{ github.run_number }}.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
